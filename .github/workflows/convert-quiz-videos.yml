name: Convert quiz videos to browser-friendly MP4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Convert clips
        run: |
          ffmpeg -i assets/iceland/IMG_3897.mov -map 0:v:0 -map '0:a?' -vf "scale='min(1280,iw)':'min(1280,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart -y assets/iceland/hreppar.mp4
          ffmpeg -i assets/current-affairs/rholdn-reunion.mov -map 0:v:0 -map '0:a?' -vf "scale='min(1280,iw)':'min(1280,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart -y assets/current-affairs/rholdn-reunion.mp4
      - name: Commit browser-compatible videos and remove the temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/iceland/hreppar.mp4 assets/current-affairs/rholdn-reunion.mp4
          git rm .github/workflows/convert-quiz-videos.yml
          git commit -m "Convert quiz clips to browser-friendly MP4"
          git push
