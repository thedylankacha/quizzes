<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101015">
  <meta name="description" content="Quizmas 2026 — a festive quiz night presentation.">
  <title>Quizmas 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--ink:#f8f3e8;--muted:#c6bda9;--gold:#e8c779;--red:#9f1d2b;--deep:#101015;--green:#173e34;--safe:clamp(20px,5vw,76px)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--deep);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
    button{font:inherit;color:inherit}.stage{position:relative;width:100%;height:100dvh;min-height:360px;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#54252b 0,#28151d 38%,#111219 73%,#090d10 100%)}
    .stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(ellipse at 8% 12%,#e4b76b20,transparent 26%),radial-gradient(ellipse at 92% 83%,#8d1d2a2b,transparent 30%),radial-gradient(circle at 16% 30%,#ffe7ad91 0 1px,transparent 2px),radial-gradient(circle at 80% 21%,#ffe7ad80 0 1px,transparent 2px),radial-gradient(circle at 71% 76%,#e8c77970 0 1px,transparent 2px),radial-gradient(circle at 31% 84%,#ffffff55 0 1px,transparent 2px)}
    .glow{position:absolute;width:52vw;height:52vw;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,#bb8b3730,transparent 67%);pointer-events:none}
    .slide{position:absolute;inset:0;display:grid;place-items:center;padding:var(--safe);opacity:0;visibility:hidden;transform:translateX(2.5%);transition:opacity .38s ease,transform .5s cubic-bezier(.2,.7,.15,1),visibility .38s; z-index:1}
    .slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide.past{transform:translateX(-2.5%)}.slide:before{content:"";position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .35s ease}.slide[class*="scene-"]:before{opacity:1}
    .content{width:min(100%,1220px);text-align:center;position:relative;z-index:1}.content.quiz-content{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(1rem,2vh,1.5rem)}.eyebrow{font-size:clamp(.68rem,1.2vw,.9rem);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 1.4rem}
    h1,h2,p{margin-top:0}.display{font-family:'Playfair Display',Georgia,serif;font-weight:600;letter-spacing:-.045em;line-height:.98;margin:0 auto;text-wrap:balance;text-shadow:0 8px 34px #0007}
    .cover-title{font-size:clamp(4.4rem,14vw,12.5rem);line-height:.82;color:#f7ead0}.cover-title span{display:block;color:var(--gold);font-size:.48em;letter-spacing:.2em;text-transform:uppercase;margin-top:.32em}
    .ornament{display:flex;align-items:center;justify-content:center;gap:1rem;color:var(--gold);margin:clamp(22px,5vh,52px) 0;font-size:1.15rem}.ornament:before,.ornament:after{content:"";height:1px;width:clamp(48px,10vw,140px);background:linear-gradient(90deg,transparent,var(--gold))}.ornament:after{transform:scaleX(-1)}
    .subtitle{color:var(--muted);font-size:clamp(.9rem,1.7vw,1.25rem);letter-spacing:.12em;text-transform:uppercase}
    .round-number{font-size:clamp(.78rem,1.3vw,1rem);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:1.3rem}
    .round-title{font-size:clamp(3rem,9vw,8.6rem);max-width:1000px}.round:nth-child(odd) .round-title{color:#f2e6cc}
    .answers-divider .content{display:grid;align-content:center;gap:1.2rem}.answers-divider .round-title{color:var(--gold)}.answers-divider .subtitle{margin:0}
    .scene-hawaii:before{background:linear-gradient(180deg,#11162270 0%,#11162255 48%,#071a23a6 100%),radial-gradient(circle at 77% 42%,#ffd88d 0 3%,#f6a96288 3.4% 7%,transparent 7.5%),linear-gradient(152deg,transparent 0 48%,#172622 48.5% 62%,transparent 62.5%),linear-gradient(180deg,transparent 0 60%,#176377 60% 76%,#0b2b3c 77%),radial-gradient(ellipse at 50% 95%,#297f7c 0,transparent 46%),linear-gradient(180deg,#d1785b 0,#6d5261 56%,#102b35 100%)}
    .scene-japan:before{background:linear-gradient(180deg,#100f1b55,#130d1888),radial-gradient(circle at 75% 39%,#ffcf91 0 2.4%,#e64b4c 2.7% 7%,#9d263d66 7.5% 13%,transparent 13.5%),linear-gradient(180deg,transparent 0 62%,#111320 63% 100%),linear-gradient(145deg,transparent 0 51%,#29303b 51.5% 63%,transparent 63.5%),linear-gradient(180deg,#262d48 0,#9c5360 58%,#181520 100%)}
    .scene-germany:before{background:linear-gradient(180deg,#10182955,#10151dcc),linear-gradient(145deg,transparent 0 46%,#d6e1df 46.5% 48%,#344250 48.5% 60%,transparent 60.5%),linear-gradient(215deg,transparent 0 48%,#e7ece5 48.5% 50%,#2c3c3e 50.5% 61%,transparent 61.5%),linear-gradient(180deg,transparent 0 66%,#1a493b 66.5% 100%),radial-gradient(ellipse at 50% 100%,#275b43 0,transparent 54%),linear-gradient(180deg,#182e4b 0,#a7a6a0 57%,#1b2828 100%)}
    .scene-swahili:before{background:linear-gradient(180deg,#17122455,#1a1018a0),radial-gradient(circle at 75% 42%,#ffd77e 0 4%,#ed9b55a6 4.5% 10%,transparent 10.5%),linear-gradient(180deg,transparent 0 65%,#32251f 65.5% 70%,transparent 70.5%),linear-gradient(176deg,transparent 0 71%,#a86b3b 71.5% 79%,#60402b 79.5%),linear-gradient(180deg,#65506a 0,#d58a58 58%,#8f5837 100%)}
    .scene-arabic:before{background:linear-gradient(180deg,#16142c55,#1c1120a6),radial-gradient(circle at 80% 30%,#f6e4bf 0 2.7%,transparent 3%),radial-gradient(circle at 81% 29%,#373047 0 2.5%,transparent 3%),linear-gradient(165deg,transparent 0 62%,#5d3a37 62.5% 69%,transparent 69.5%),linear-gradient(195deg,transparent 0 69%,#a45d3e 69.5% 77%,transparent 77.5%),linear-gradient(180deg,#31304b 0,#ca7950 58%,#241920 100%)}
    .holiday-frame{position:absolute;inset:clamp(9px,1.4vw,18px);z-index:4;pointer-events:none;border:1px solid #e8c7799c;border-radius:18px;box-shadow:inset 0 0 0 5px #0b1415a8,inset 0 0 0 6px #e8c77936,0 0 28px #0005}
    .holiday-frame:before,.holiday-frame:after{content:"";position:absolute;left:clamp(76px,11vw,150px);right:clamp(76px,11vw,150px);height:12px;background:radial-gradient(ellipse at 50% 100%,#286043 0 42%,transparent 46%) 0 0/22px 14px repeat-x,radial-gradient(circle at 10px 5px,#bd3540 0 2px,transparent 2.8px) 0 0/44px 14px repeat-x;opacity:.95}
    .holiday-frame:before{top:-5px}.holiday-frame:after{bottom:-5px;transform:rotate(180deg)}
    .question-number{color:var(--gold);font-size:clamp(.78rem,1.3vw,1rem);letter-spacing:.25em;text-transform:uppercase;font-weight:700;margin:0;text-align:left}
    .slide-body{min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;justify-items:stretch}
    .slide-body.with-media{grid-template-columns:minmax(0,1fr) minmax(0,min(34vw,410px));gap:clamp(1.4rem,4vw,3.5rem)}
    .slide-copy{min-width:0;width:100%;max-height:100%;padding-top:clamp(.8rem,3vh,2rem);display:flex;flex-direction:column;justify-content:flex-start;align-items:center}.slide-copy.has-options{justify-content:center;padding-top:0}
    .question-text{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.45rem,2.6vw,2.4rem);line-height:1.25;letter-spacing:-.012em;max-width:100%;margin:0;text-wrap:balance}
    .answer{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.45rem,2.6vw,2.4rem);color:var(--gold);line-height:1.2;margin:clamp(1rem,3vh,2rem) 0 0;text-wrap:balance}
    .options{list-style:none;padding:0;margin:clamp(1.2rem,3vh,2rem) auto 0;display:flex;flex-direction:column;align-items:center;gap:.55rem;width:min(100%,640px);text-align:center}
    .options li{width:100%;border:1px solid #e8c77945;background:#171a1966;border-radius:9px;padding:.55rem .9rem;color:#f1eadb;text-align:center;font-size:clamp(.95rem,1.7vw,1.35rem);line-height:1.25}
    .options li.correct{border-color:var(--gold);background:#e8c77922;color:var(--gold);box-shadow:0 0 24px #e8c77920}
    .placeholder{font-family:'DM Sans',system-ui,sans-serif;font-size:clamp(.82rem,1.4vw,1rem);color:#d2c7b4;border:1px dashed #e8c77975;padding:1.1rem 1.4rem;border-radius:12px;width:100%;background:#171a19a6;letter-spacing:.015em;line-height:1.5}
    .placeholder strong{color:var(--gold);display:block;text-transform:uppercase;letter-spacing:.15em;font-size:.73rem;margin-bottom:.3rem}
    .media-slot{width:100%;height:100%;min-width:0;min-height:0;display:grid;place-items:center}.media-slot.reserved{visibility:hidden}
    .photo-frame{width:100%;height:100%;min-height:0;margin:0;display:grid;place-items:center}
    .baban-photo{display:block;max-width:100%;max-height:min(100%,62vh,680px);width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 18px 55px #0008}
    .quiz-video{display:block;width:auto;height:auto;max-width:100%;max-height:min(100%,62vh,680px);object-fit:contain;border-radius:12px;box-shadow:0 18px 55px #0008;background:#08090b}
    .finale{background:linear-gradient(90deg,#5d101b,#a72231 18%,#731520 32%,#a72231 50%,#731520 68%,#a72231 82%,#5d101b);box-shadow:inset 26px 0 38px #27070dcc,inset -26px 0 38px #27070dcc}
    .finale:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff08 0,#0002 4%,transparent 8%,#0002 12%);box-shadow:inset 0 0 110px #20040cc9}
    .finale .content{z-index:1}.thanks{font-size:clamp(3.2rem,10vw,9rem);color:#fff0d7}.finale .ornament{color:#f3d897}
    .topbar{position:absolute;z-index:5;left:var(--safe);right:var(--safe);top:clamp(17px,3vh,32px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:.7rem;text-transform:uppercase;letter-spacing:.22em;color:#ffffff9a;font-weight:700}.counter{font-variant-numeric:tabular-nums;color:#ffffffa8;font-size:.78rem;letter-spacing:.12em}
    .progress-track{position:absolute;z-index:6;left:0;right:0;bottom:0;height:4px;background:#ffffff18}.progress-bar{height:100%;width:0;background:var(--gold);transition:width .3s ease;box-shadow:0 0 16px #e8c77980}
    .controls{position:absolute;z-index:7;left:var(--safe);right:var(--safe);bottom:clamp(22px,5vh,52px);display:flex;justify-content:space-between;align-items:center;pointer-events:none}.nav{pointer-events:auto;border:1px solid #ffffff34;background:#141816a8;backdrop-filter:blur(8px);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s,border .2s,transform .2s}.nav:hover,.nav:focus-visible{outline:none;background:#e8c77922;border-color:var(--gold);transform:scale(1.06)}.nav:disabled{opacity:.2;cursor:default;transform:none}.nav svg{width:18px;height:18px}.hint{font-size:.72rem;color:#ffffff75;letter-spacing:.08em}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:680px){.topbar{top:18px}.brand{font-size:.61rem}.controls{bottom:18px}.nav{width:44px;height:44px}.hint{font-size:.63rem}.round-title{font-size:clamp(2.8rem,13vw,5rem)}.content.quiz-content{gap:.8rem}.slide-body.with-media{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,min(24vh,210px));gap:.7rem}.slide-copy{padding-top:.4rem}.question-text,.answer{font-size:clamp(1.05rem,4.2vw,1.45rem);line-height:1.2}.answer{margin-top:.7rem}.question-number{font-size:.68rem;letter-spacing:.16em}.baban-photo,.quiz-video{max-height:100%}.placeholder{padding:.8rem 1rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Quizmas 2026 presentation">
    <div class="glow" aria-hidden="true"></div>
    <div class="holiday-frame" aria-hidden="true"></div>
    <div class="topbar"><div class="brand">Quizmas 2026</div><div class="counter" id="counter" aria-live="polite"></div></div>
    <div id="deck"></div>
    <div class="controls" aria-label="Presentation controls">
      <button class="nav" id="back" type="button" aria-label="Previous slide" title="Previous slide (Left arrow)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="hint">← → &nbsp;·&nbsp; SPACE &nbsp;·&nbsp; TAP TO MOVE</div>
      <button class="nav" id="next" type="button" aria-label="Next slide" title="Next slide (Right arrow)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  </main>
  <script>
    // Approved Quizmas 2026 content. Question wording is kept verbatim.
    const rounds = [
      { title: "Lost in Translation", questions: [
        { text: "Which Hawaiian word describes smooth, rope-like volcanic lava?", options: ["ʻAʻā", "Pāhoehoe", "Kīpuka", "Pele", "Pali"], answer: "Pāhoehoe", scene: "hawaii" },
        { text: "What is the Japanese word for the practice of repairing broken pottery with gold, making the damage part of its beauty?", options: ["Ikigai", "Tsundoku", "Kintsugi", "Komorebi", "Wabi-sabi"], answer: "Kintsugi", scene: "japan" },
        { text: "Which German word describes a longing for distant places, particularly places you've never visited?", options: ["Fernweh", "Heimweh", "Schadenfreude", "Zeitgeist", "Fingerspitzengefühl"], answer: "Fernweh", scene: "germany" },
        { text: "Which Swahili verb means “sleep!”?", options: ["Kula", "Lala", "Kunywa", "Cheka", "Tembea"], answer: "Lala", scene: "swahili" },
        { text: "Four of these English words entered English via Arabic. Which one did not?", options: ["Algebra", "Alcohol", "Algorithm", "Alchemy", "Altitude"], answer: "Altitude", scene: "arabic" }
      ]},
      { title: "Hansel & Gretel", questions: [
        { text: "What is the name given to the phenomenon in which a photon scatters off an electron, transferring some of its energy and changing wavelength?", answer: "Compton scattering." },
        { text: "Who, alongside Tenzing Norgay, made the first confirmed ascent of Mount Everest in 1953?", answer: "Edmund Hillary." },
        { text: "Which actress won the Academy Award for Best Actress for her roles in Fargo, Three Billboards Outside Ebbing, Missouri and Nomadland?", answer: "Frances McDormand." },
        { text: "In I've Got a Brand New Combine Harvester by The Wurzels, if the protagonist had four children and bequeathed his land to them in equal shares upon his death, how much land would each child inherit, assuming the woman he is courting never married him?", answer: "Five acres." },
        { text: "Which ancient Greek mathematician is traditionally known as the father of geometry, having written the influential mathematical treatise Elements?", answer: "Euclid." },
        { text: "In fixed-income markets, what animal is used to describe a yield-curve movement in which government bond yields rise, whether the curve steepens or flattens?", answer: "Bear." },
        { text: "Which town on Connecticut’s Gold Coast—home to both Sacred Heart University and its own namesake Jesuit university—shares its name with a popular mid-scale Marriott hotel brand and a famous arts centre in Croydon, South London?", answer: "Fairfield." },
        { text: "What is the common name given to the thorny, scrambling shrubs of the genus Rubus, which produce blackberries and commonly form dense thickets in the British countryside?", answer: "Brambles." },
        { text: "What is the name given to the orchestra comprised of students from Lincoln, Exeter and Jesus colleges?", answer: "Turl Street Orchestra." },
        { text: "What connects the answers to the preceding nine questions?", answer: "They are all streets on which members of the group have lived." }
      ]},
      { title: "Merry Quizmas", questions: [
        { text: "In Icelandic Christmas folklore, thirteen mischievous characters visit children on the thirteen nights leading up to Christmas. What are these characters collectively known as?", answer: "Yule Lads (Jólasveinar)." },
        { text: "Which traditional Italian Christmas cake, originating in Verona, is recognisable by its tall, eight-pointed star shape and is traditionally dusted with icing sugar?", answer: "Pandoro." },
        { text: "The first commercially produced Advent calendar is generally credited to German printer Gerhard Lang. In which year did he produce it?", answer: "1908." },
        { text: "In July 1945, during a particularly hot summer in California, songwriter Robert Wells began writing down wintry images in an attempt to cool himself down. His collaborator Mel Tormé later turned these musings into which famous Christmas song?", answer: "The Christmas Song (Chestnuts Roasting on an Open Fire)." },
        { text: "Which London confectioner is credited with inventing the Christmas cracker, initially selling sugared almonds wrapped in decorative paper before developing the familiar explosive mechanism?", answer: "Tom Smith." },
        { text: "In 1939, an American department store commissioned a copywriter to create a free Christmas storybook for children. The original character he created became an enormous success, with 2.4 million copies distributed in its first year. What was the character?", answer: "Rudolph (Rudolph the Red-Nosed Reindeer)." },
        { text: "Attracting more than two million visitors each year, with around 180 wooden stalls filling the city's historic main square, this is one of the most famous Christmas markets in the world. Its name translates roughly as ‘Christ Child Market’. In which German city is it held?", answer: "Nuremberg." },
        { text: "On 16 December 1965, astronauts Wally Schirra and Tom Stafford interrupted a routine transmission from NASA's Gemini 6 spacecraft to report an unidentified object approaching. They then sent Mission Control a musical performance. Which song did they play?", answer: "Jingle Bells." },
        { text: "Since 1947, a large Christmas tree has been sent to London each year as a gift of gratitude for Britain's support during the Second World War. Which country sends the tree displayed in Trafalgar Square?", answer: "Norway." },
        { text: "On Christmas Day 1932, the British monarch delivered the first ever Royal Christmas Broadcast. Written by Rudyard Kipling and transmitted from Sandringham to listeners across the British Empire, the address began a tradition that continues to this day. Who delivered this address?", answer: "King George V." }
      ]},
      { title: "Current Affairs", questions: [
        { text: "In the recent reunion of The Real Housewives of London, Karen Loderick and Amanda Cronin got into a heated argument regarding one another's real estate holdings, which led to Karen hurling what insult which has since gone viral?", answer: "Low budget vagina, Amanda", video: "assets/current-affairs/rholdn-reunion.mp4", answerVideoOnly: true },
        { text: "Jensen Huang has been removed as CEO of Nvidia following the recent honeypot scandal where he is purported to have been seduced by a spy working for China's Ministry of State Security. What was this spy's name?", answer: "Alice Huang" },
        { text: "In the recent midterms, we saw Islamophobia normalised across the US, with Trump referring to one candidate as \"Mohammad Ramadan\". Who was this candidate who went on to win the Michigan Senate seat?", answer: "Abdul El-Sayed" },
        { text: "The new UK Jobs Guarantee aims to tackle unemployment in young people promising gainful employment to those ages 18-24 for how long?", answer: "Six months" },
        { text: "We had Robert Pattinson confirmed as the new James Bond this week, a disappointment to some, but who, according to the public and the betting shops, is the frontrunner to be the next Bond girl?", answer: "Margaret Qualley" }
      ]},
      { title: "The Numbers Game", questions: [
        { text: "How much did the world's largest Christmas pudding weigh?", answer: "3,280 kg." },
        { text: "How long was the world's largest Christmas cracker?", answer: "2,484 inches (approximately 63.1 metres)." },
        { text: "How much did Leonardo da Vinci's Salvator Mundi sell for at auction in 2017?", answer: "$450,312,500." },
        { text: "How many minutes did the famous 2010 Wimbledon first-round match between John Isner and Nicolas Mahut last in total?", answer: "665 minutes (11 hours and 5 minutes)." },
        { text: "Following a comprehensive survey completed in 2012, what was the total measured length of the Great Wall of China, including sections built by different dynasties?", answer: "21,196.18 km." }
      ]},
      { title: "Guess the Baban", questions: [
        { photo: "assets/baban/mand.jpg", answer: "Mand" }, { photo: "assets/baban/jess-hoar.jpg", answer: "Jess Hoar" }, { photo: "assets/baban/fraser-mcdougall.jpg", answer: "Fraser McDougall" },
        { photo: "assets/baban/evie-sutcliffe.jpg", answer: "Evie Sutcliffe" }, { photo: "assets/baban/tom-taylor.jpg", answer: "Tom Taylor" }, { photo: "assets/baban/rebekah-goodchild.jpg", answer: "Rebekah Goodchild" },
        { photo: "assets/baban/george-holding.jpg", answer: "George Holding" }, { photo: "assets/baban/hannah-alcock.jpg", answer: "Hannah Alcock" }, { photo: "assets/baban/leon-galli.jpg", answer: "Leon Galli" },
        { photo: "assets/baban/quiz-host.jpg", answer: "Me" }
      ]},
      { title: "Fire and Ice", questions: [
        { text: "Which tectonic plate am I standing on?", answer: "Hreppar Microplate.", video: "assets/iceland/hreppar.mp4" },
        { text: "The Blue Lagoon's distinctive milky-blue colour comes from a naturally occurring compound suspended in its water. What is it?", answer: "Silica (silicon dioxide, SiO₂).", photo: "assets/iceland/blue-lagoon.jpeg" },
        { text: "The green colour of the aurora borealis, which I witnessed in Iceland, is produced when charged solar particles interact with atoms of which atmospheric element?", answer: "Oxygen.", photo: "assets/iceland/northern-lights.jpeg" },
        { text: "What flavouring gives Iceland's signature spirit Brennivín its distinctive taste?", answer: "Caraway.", photo: "assets/iceland/brennivin.png" },
        { text: "How many pipes does the enormous pipe organ inside Hallgrímskirkja contain?", answer: "5,275.", photo: "assets/iceland/hallgrimskirkja.jpeg" },
        { text: "In which year was Reykjavík's famous rainbow-painted street first painted in celebration of Pride?", answer: "2015.", photo: "assets/iceland/rainbow-street.jpeg" },
        { text: "Iceland's extensive lava fields are predominantly composed of a dark, fine-grained volcanic rock. What is this rock called?", answer: "Basalt.", photo: "assets/iceland/basalt.jpeg" },
        { text: "The Gullfoss waterfall descends into its canyon in two stages. What is the total height of the waterfall?", answer: "32 metres.", photo: "assets/iceland/gullfoss.jpeg" },
        { text: "Þingvellir National Park in Iceland doubled as the setting for a famous fictional location in Game of Thrones. What is the name of the mountain pass leading to the Eyrie?", answer: "The Bloody Gate.", photo: "assets/iceland/bloody-gate.jpeg" },
        { text: "Long before the first settlers arrived on Iceland's shores, the island's vast mountains, volcanic landscapes and remote wilderness were said to be inhabited by ancient, mysterious beings. Hidden from human civilisation, these creatures became deeply woven into Icelandic folklore and legend. By what name are these mythical inhabitants known?", answer: "Trolls.", photo: "assets/iceland/trolls.jpeg", answerPhotoOnly: true }
      ]}
    ];
    const slides = [{kind:'cover'}, ...rounds.flatMap((round, r) => [
      {kind:'round', title:round.title, round:r+1},
      ...round.questions.map((q, i) => ({kind:'question', title:round.title, round:r+1, number:i+1, ...q})),
      {kind:'answers', title:round.title, round:r+1},
      ...round.questions.flatMap((q, i) => [
        {kind:'answer-question', title:round.title, round:r+1, number:i+1, ...q},
        {kind:'answer', title:round.title, round:r+1, number:i+1, ...q}
      ])
    ]), {kind:'finale'}];
    const deck = document.getElementById('deck');
    const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const placeholder = (note) => `<div class="placeholder"><strong>Photo placeholder</strong>${esc(note)}</div>`;
    function markup(slide){
      if(slide.kind==='cover') return `<div class="content"><p class="eyebrow">The annual festive quiz</p><h1 class="display cover-title">Quiz<span>mas</span></h1><div class="ornament" aria-hidden="true">✦</div><p class="subtitle">2026 &nbsp;·&nbsp; Let the games begin</p></div>`;
      if(slide.kind==='round') return `<div class="content"><h2 class="display round-title">${esc(slide.title)}</h2></div>`;
      if(slide.kind==='answers') return `<div class="content"><p class="eyebrow">Round ${String(slide.round).padStart(2,'0')}</p><h2 class="display round-title">Answers</h2><p class="subtitle">${esc(slide.title)}</p></div>`;
      if(slide.kind==='finale') return `<div class="content"><p class="eyebrow">Quizmas 2026</p><h2 class="display thanks">Thanks for<br>Playing!</h2><div class="ornament" aria-hidden="true">✦</div><p class="subtitle">Merry Quizmas</p></div>`;
      const label = `Round ${String(slide.round).padStart(2,'0')} · ${esc(slide.title)} · Question ${slide.number}`;
      const reveal = slide.kind==='answer';
      const showPhoto = slide.photo && (!slide.answerPhotoOnly || reveal);
      const showVideo = slide.video && (!slide.answerVideoOnly || reveal || slide.kind==='answer-question');
      const reservePhoto = Boolean(slide.photo || slide.video || slide.photoPlaceholder);
      const media = showPhoto ? `<figure class="photo-frame"><img class="baban-photo" src="${esc(slide.photo)}" alt="${slide.title==='Guess the Baban'?'Childhood photo clue':'Iceland photo'}"></figure>` : showVideo ? `<figure class="photo-frame"><video class="quiz-video" controls playsinline preload="metadata" aria-label="${slide.title==='Current Affairs'?'Real Housewives of London reunion clip':'Hreppar location video'}"><source src="${esc(slide.video)}" type="video/mp4"></video></figure>` : (slide.photoPlaceholder ? placeholder(slide.photoPlaceholder) : '');
      const prompt = slide.text || (slide.title==='Guess the Baban' ? 'Who is this?' : '');
      const text = prompt ? `<p class="question-text">${esc(prompt)}</p>` : '';
      const options = slide.options ? `<ul class="options">${slide.options.map(option => `<li class="${reveal&&option===slide.answer?'correct':''}">${esc(option)}</li>`).join('')}</ul>` : '';
      const answer = reveal ? `<p class="answer">${esc(slide.answer)}</p>` : '';
      const phase = slide.kind==='answer-question' ? ' · Question' : reveal ? ' · Answer' : '';
      const mediaSlot = reservePhoto ? `<div class="media-slot${media?'':' reserved'}">${media}</div>` : '';
      const copyClass = slide.options ? 'slide-copy has-options' : 'slide-copy';
      return `<div class="content quiz-content"><p class="question-number">${label}${phase}</p><div class="slide-body${reservePhoto?' with-media':''}"><div class="${copyClass}">${text}${options}${answer}</div>${mediaSlot}</div></div>`;
    }
    slides.forEach((slide, index) => { const el=document.createElement('section'); el.className=`slide ${slide.kind==='round'?'round':''} ${slide.kind==='answers'?'answers-divider':''} ${slide.kind==='finale'?'finale':''} ${slide.scene?`scene-${slide.scene}`:''}`;el.setAttribute('aria-label',slide.kind==='cover'?'Quizmas 2026 opening slide':slide.kind==='finale'?'Thanks for Playing':`${slide.title||'Quizmas'} ${slide.kind} slide`);el.innerHTML=markup(slide);deck.appendChild(el); });
    const nodes=[...deck.children]; let current=0;
    function show(index, updateHash=true){ current=Math.max(0,Math.min(nodes.length-1,index)); nodes.forEach((node,i)=>{node.classList.toggle('active',i===current);node.classList.toggle('past',i<current);node.setAttribute('aria-hidden',i===current?'false':'true');});document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(nodes.length).padStart(2,'0')}`;document.getElementById('progress').style.width=`${(current/(nodes.length-1))*100}%`;document.getElementById('back').disabled=current===0;document.getElementById('next').disabled=current===nodes.length-1;if(updateHash)history.replaceState(null,'',`#${current+1}`);}
    const next=()=>show(current+1), back=()=>show(current-1);
    document.getElementById('next').addEventListener('click',next);document.getElementById('back').addEventListener('click',back);
    window.addEventListener('keydown',(event)=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(event.key)){event.preventDefault();back()}else if(event.key==='Home')show(0);else if(event.key==='End')show(nodes.length-1);});
    let touchStart=null;document.getElementById('stage').addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].clientX},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{if(touchStart===null)return;const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>55){dx<0?next():back()}touchStart=null},{passive:true});
    document.getElementById('stage').addEventListener('click',e=>{if(e.target.closest('button'))return;const x=e.clientX/window.innerWidth;if(x>.68)next();else if(x<.32)back()});
    const hash=Number(location.hash.slice(1));show(Number.isFinite(hash)&&hash>0?hash-1:0,false);
    if('serviceWorker' in navigator && location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
